{% extends "base.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <style>

        
.form-control {
    display: block;
    margin-left: 425px;
    width: 25%;
    padding: 6px 12px;
    font-size: 14px;
    line-height: 1.42857143;
    color: #555;
    background-color: #fff;
    background-image: none;
    border: 1px solid #ccc;
    border-radius: 4px;
    -webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
    box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container text-center mt-5">
    <h2>Elige tu tipo de registro</h2>
    <div class="row justify-content-center mt-4">
        <div class="col-md-3">
            <button onclick="showForm('comun')" class="btn btn-primary btn-lg btn-block">
                Mi Argentina
            </button>
        </div>
        <div class="col-md-3">
            <button onclick="showForm('empresa')" class="btn btn-primary btn-lg btn-block">
                Regístrate como Empresa
            </button>
        </div>
    </div>

    <div id="comun-form" class="form-section mt-5">
        <h3>Registro de Usuario Común</h3>
        <form method="post" action="{% url 'register_comun' %}">
            {% csrf_token %}
            {{ comun_form.as_p }}
            <button type="submit" class="btn btn-success">Registrarse</button>
        </form>
    </div>

    <div id="empresa-form" class="form-section mt-5">
        <h3>Registro de Usuario Empresa</h3>
        <form method="post" action="{% url 'register_empresa' %}">
            {% csrf_token %}
            {{ empresa_form.as_p }}
            <button type="submit" class="btn btn-success">Registrarse</button>
        </form>
    </div>

</div>

<script type="text/javascript">
    function showForm(formType) {
        $('.form-section').hide();
        $('#' + formType + '-form').show();
    }

    $(document).ready(function() {
        {% if show_comun_form %}
        showForm('comun');
        {% elif show_empresa_form %}
        showForm('empresa');
        {% endif %}
    });
</script>

</body>
</html>
{% endblock %}
